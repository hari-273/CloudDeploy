name: CloudDeploy CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: true

          script: |
            whoami
            pwd

            cd /home/ubuntu/CloudDeploy

            git pull origin main

            docker stop clouddeploy || true
            docker rm clouddeploy || true

            docker build -t clouddeploy .

            docker run -d --name clouddeploy -p 80:80 clouddeploy

            docker ps